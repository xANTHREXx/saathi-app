<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=720, height=720" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        margin: 0;
        width: 720px;
        height: 720px;
        overflow: hidden;
        background: #0D1222;
      }
      #root {
        width: 720px;
        height: 720px;
        position: relative;
        background: #0D1222;
        overflow: hidden;
      }
      .star-node {
        position: absolute;
        width: 32px;
        height: 32px;
        margin-left: -16px;
        margin-top: -16px;
      }
      .auto-vehicle {
        position: absolute;
        width: 48px;
        height: 56px;
        margin-left: -24px;
        margin-top: -28px;
        z-index: 10;
        filter: drop-shadow(0 8px 16px rgba(11,15,28,0.5));
      }
      /* Countdown Ring */
      .ring-svg {
        position: absolute;
        left: 360px;
        top: 240px;
        margin-left: -70px;
        margin-top: -70px;
        width: 140px;
        height: 140px;
        transform: rotate(-90deg);
        z-index: 20;
        pointer-events: none;
      }
      .ring-track {
        fill: none;
        stroke: #252F52;
        stroke-width: 8;
      }
      .ring-bar {
        fill: none;
        stroke: #E7B94A;
        stroke-width: 8;
        stroke-linecap: round;
        stroke-dasharray: 377;
        stroke-dashoffset: 0;
      }
      /* I'm okay button plate */
      .okay-plate {
        position: absolute;
        left: 200px;
        top: 440px;
        width: 320px;
        height: 96px;
        background: #EEF0F7;
        border-radius: 32px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 14px;
        box-shadow: 0 16px 36px rgba(11,15,28,0.5);
        z-index: 25;
      }
      .touch-indicator {
        position: absolute;
        width: 60px;
        height: 60px;
        border-radius: 50%;
        background: rgba(17, 22, 42, 0.25);
        border: 2px solid #11162A;
        pointer-events: none;
        opacity: 0;
        transform: scale(0.5);
        z-index: 35;
      }
      /* Calm OK Green Ripple */
      .ok-ripple {
        position: absolute;
        left: 360px;
        top: 240px;
        margin-left: -60px;
        margin-top: -60px;
        width: 120px;
        height: 120px;
        border-radius: 50%;
        border: 3px solid #7BD3A4;
        opacity: 0;
        pointer-events: none;
        z-index: 22;
      }
      /* Madder alert outgoing bubble */
      .madder-bubble {
        position: absolute;
        left: 250px;
        top: 210px;
        width: 220px;
        background: #5A1714;
        border: 1.5px solid #C7372F;
        border-radius: 20px;
        padding: 14px 18px;
        opacity: 0;
        z-index: 30;
        box-shadow: 0 16px 40px rgba(90, 23, 20, 0.7);
      }
      .madder-wave {
        position: absolute;
        left: 360px;
        top: 240px;
        margin-left: -90px;
        margin-top: -90px;
        width: 180px;
        height: 180px;
        border-radius: 50%;
        border: 3px solid #C7372F;
        opacity: 0;
        pointer-events: none;
        z-index: 21;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      class="clip"
      data-composition-id="onb_saathi_asks"
      data-start="0"
      data-duration="10"
      data-width="720"
      data-height="720"
    >
      <!-- Road Track -->
      <svg width="720" height="720" style="position:absolute; inset:0;">
        <path d="M 100 240 L 620 240" fill="none" stroke="#1B2340" stroke-width="12" stroke-linecap="round" />
        <path d="M 100 240 L 620 240" fill="none" stroke="#252F52" stroke-width="2" stroke-dasharray="8 8" />
      </svg>

      <!-- Stamped Stars along track -->
      <div class="star-node" style="left:160px; top:240px;">
        <svg viewBox="0 0 48 48"><rect x="10" y="10" width="28" height="28" rx="2" fill="#8FA2E8"/><rect x="10" y="10" width="28" height="28" rx="2" fill="#8FA2E8" transform="rotate(45 24 24)"/></svg>
      </div>
      <div class="star-node" style="left:260px; top:240px;">
        <svg viewBox="0 0 48 48"><rect x="10" y="10" width="28" height="28" rx="2" fill="#8FA2E8"/><rect x="10" y="10" width="28" height="28" rx="2" fill="#8FA2E8" transform="rotate(45 24 24)"/></svg>
      </div>

      <!-- Newest Star at stall point (360, 240) -->
      <div id="stallStar" class="star-node" style="left:360px; top:240px; z-index:15;">
        <svg viewBox="0 0 48 48">
          <rect id="starBox1" x="10" y="10" width="28" height="28" rx="2" fill="#8FA2E8"/>
          <rect id="starBox2" x="10" y="10" width="28" height="28" rx="2" fill="#8FA2E8" transform="rotate(45 24 24)"/>
        </svg>
      </div>

      <!-- Auto Rickshaw vehicle -->
      <div id="auto" class="auto-vehicle">
        <svg viewBox="0 0 52 64" fill="none">
          <rect x="4" y="38" width="6" height="18" rx="3" fill="#11162A" />
          <rect x="42" y="38" width="6" height="18" rx="3" fill="#11162A" />
          <rect x="23" y="2" width="6" height="14" rx="3" fill="#11162A" />
          <rect x="8" y="18" width="36" height="42" rx="10" fill="#1E7A4C" />
          <rect x="10" y="14" width="32" height="34" rx="8" fill="#E7B94A" />
          <rect x="14" y="16" width="24" height="10" rx="3" fill="#0D1222" />
        </svg>
      </div>

      <!-- Check-in Countdown Ring -->
      <svg id="ringSvg" class="ring-svg" viewBox="0 0 140 140">
        <circle class="ring-track" cx="70" cy="70" r="60" />
        <circle id="ringBar" class="ring-bar" cx="70" cy="70" r="60" />
      </svg>

      <!-- BRANCH 1: "I'm okay" plate -->
      <div id="branch1Wrap">
        <div id="okayPlate" class="okay-plate">
          <div style="width:36px; height:36px; border-radius:50%; background:#11162A; display:flex; align-items:center; justify-content:center;">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="#FFFFFF"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>
          </div>
          <div style="width:130px; height:16px; background:#11162A; border-radius:5px;"></div>
        </div>

        <!-- Touch tap on "I'm okay" -->
        <div id="okayTouch" class="touch-indicator" style="left:330px; top:455px;"></div>

        <!-- Green OK ripple -->
        <div id="okRipple" class="ok-ripple"></div>
      </div>

      <!-- BRANCH 2: Madder Alert elements -->
      <div id="branch2Wrap">
        <div id="madderWave" class="madder-wave"></div>
        <div id="madderBubble" class="madder-bubble">
          <div style="display:flex; align-items:center; gap:8px; margin-bottom:10px;">
            <div style="width:12px; height:12px; border-radius:50%; background:#C7372F;"></div>
            <div style="width:100px; height:10px; background:#FFDAD5; border-radius:5px;"></div>
          </div>
          <div style="width:160px; height:8px; background:#FFDAD5; opacity:0.8; border-radius:4px; margin-bottom:6px;"></div>
          <div style="width:110px; height:8px; background:#FFDAD5; opacity:0.8; border-radius:4px;"></div>
        </div>
      </div>
    </div>

    <script>
      // Immediate initial setup outside paused timeline
      gsap.set("#auto", { x: 100, y: 240, rotation: 90, opacity: 1 });
      gsap.set(["#starBox1", "#starBox2"], { fill: "#8FA2E8" });
      gsap.set("#ringSvg", { opacity: 0 });
      gsap.set("#ringBar", { strokeDashoffset: 0, stroke: "#E7B94A" });
      gsap.set("#branch1Wrap", { opacity: 1 });
      gsap.set("#okayPlate", { y: 60, opacity: 0 });
      gsap.set("#okayTouch", { scale: 0.5, opacity: 0 });
      gsap.set("#okRipple", { scale: 0.8, opacity: 0 });
      gsap.set("#branch2Wrap", { opacity: 0 });
      gsap.set("#madderWave", { scale: 0.5, opacity: 0 });
      gsap.set("#madderBubble", { y: 0, opacity: 0 });

      const tl = gsap.timeline({ paused: true });

      // --- SEQUENCE 1: AUTO MOVES AND STALLS (0s - 1.2s) ---
      tl.to("#auto", { x: 360, duration: 0.8, ease: "power2.out" }, 0.2);

      // At 1.0s: Auto stops. Newest star turns Alum (#E7B94A)!
      tl.to(["#starBox1", "#starBox2"], { fill: "#E7B94A", duration: 0.25 }, 1.0);
      tl.fromTo("#stallStar", { scale: 1 }, { scale: 1.3, duration: 0.2, yoyo: true, repeat: 1, ease: "power1.out" }, 1.0);

      // --- BRANCH 1: TAP "I'M OKAY", NOTHING SENT (1.2s - 4.8s) ---
      // Alum check-in countdown ring appears and starts draining
      tl.to("#ringSvg", { opacity: 1, duration: 0.2 }, 1.25);
      tl.to("#ringBar", { strokeDashoffset: 160, duration: 1.8, ease: "linear" }, 1.25);

      // "I'm okay" plate slides up
      tl.to("#okayPlate", { y: 0, opacity: 1, duration: 0.4, ease: "back.out(1.6)" }, 1.35);

      // Finger taps "I'm okay" at 2.4s
      tl.to("#okayTouch", { opacity: 1, scale: 1, duration: 0.15, ease: "power1.out" }, 2.4);
      tl.to("#okayTouch", { opacity: 0, scale: 1.4, duration: 0.25, ease: "power1.in" }, 2.55);

      // Ring immediately clears! Calm green ripple
      tl.to("#ringSvg", { opacity: 0, duration: 0.2 }, 2.6);
      tl.fromTo("#okRipple", { scale: 0.8, opacity: 0.9 }, { scale: 2.2, opacity: 0, duration: 0.7, ease: "power2.out" }, 2.6);
      tl.to(["#starBox1", "#starBox2"], { fill: "#7BD3A4", duration: 0.3 }, 2.6);

      // "I'm okay" plate retracts
      tl.to("#okayPlate", { y: 60, opacity: 0, duration: 0.35, ease: "power2.in" }, 3.5);

      // --- BRANCH 2: RING EMPTIES TO 0 -> MADDER ALERT SENT (4.8s - 9.4s) ---
      // Reset star to Alum and ring for second branch
      tl.to(["#starBox1", "#starBox2"], { fill: "#E7B94A", duration: 0.2 }, 4.8);
      tl.set("#ringBar", { strokeDashoffset: 0, stroke: "#E7B94A" }, 4.9);
      tl.to("#ringSvg", { opacity: 1, duration: 0.25 }, 5.0);

      // Ring drains completely over 2.6s
      tl.to("#ringBar", { strokeDashoffset: 377, duration: 2.6, ease: "linear" }, 5.1);

      // At 7.7s: Ring hits 0! Flashes madder (#C7372F)
      tl.to("#ringBar", { stroke: "#C7372F", duration: 0.1 }, 7.7);
      tl.to(["#starBox1", "#starBox2"], { fill: "#C7372F", duration: 0.15 }, 7.7);

      // Alert wave bursts
      tl.to("#branch2Wrap", { opacity: 1, duration: 0.1 }, 7.7);
      tl.fromTo("#madderWave", { scale: 0.8, opacity: 0.9 }, { scale: 2.6, opacity: 0, duration: 0.9, ease: "power2.out" }, 7.75);

      // Madder alert bubble elevates
      tl.to("#madderBubble", { opacity: 1, y: -60, duration: 0.6, ease: "back.out(1.5)" }, 7.85);

      // Loop fade out
      tl.to("#root", { opacity: 0.95, duration: 0.3, ease: "power1.in" }, 9.7);

      window.__timelines = window.__timelines || {};
      window.__timelines["onb_saathi_asks"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
