<!doctype html>
<html lang="en" data-composition-variables='[{"id":"lang","type":"string","label":"Language (en or hi)","default":"en"}]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=720, height=720" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="assets/saathi.css" />
    <style>
      .map { position: absolute; left: 0; top: 0; width: 360px; height: 330px; background: #10162A; overflow: hidden; }
      .sheet { position: absolute; left: 0; top: 292px; width: 360px; height: 560px; background: var(--bg); border-radius: 28px 28px 0 0; }
      .handle { position: absolute; left: 162px; top: 10px; width: 36px; height: 4px; border-radius: 2px; background: rgba(111,120,153,0.5); }
      .t-title { position: absolute; left: 20px; top: 30px; font-size: 22px; font-weight: 650; letter-spacing: -0.015em; }
      .t-watch { position: absolute; left: 20px; top: 64px; display: flex; gap: 8px; align-items: center; font-size: 14px; color: var(--fg2); }
      .t-min { position: absolute; right: 20px; top: 28px; text-align: right; }
      .t-min b { display: block; font-size: 24px; font-weight: 650; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
      .t-min span { font-size: 11px; color: var(--fg2); }
      .t-dest { position: absolute; left: 20px; top: 98px; display: flex; gap: 8px; align-items: center; font-size: 13px; color: var(--fg2); }
      .plate { position: absolute; right: 14px; top: 40px; height: 30px; padding: 0 10px; border-radius: 6px; background: #F7F7F2; color: #111; font-size: 13px; font-weight: 700; letter-spacing: 0.06em; display: flex; align-items: center; box-shadow: 0 0 0 2px #222 inset; }
      .ms { position: absolute; width: 18px; height: 18px; margin: -9px 0 0 -9px; }
      .ms svg { width: 100%; height: 100%; display: block; overflow: visible; }
    </style>
  </head>
  <body>
    <svg width="0" height="0" style="position:absolute">
      <symbol id="ajrakh" viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="1.2" /><rect x="5" y="5" width="14" height="14" rx="1.2" transform="rotate(45 12 12)" /></symbol>
    </svg>
    <div id="root" data-composition-id="onb_welcome" data-start="0" data-duration="9" data-width="720" data-height="720">
      <div id="cam" class="cam">
        <div id="phone" class="phone" style="left:172px; top:44px;">
          <div class="screen">
            <div class="status"><span>9:36</span><span class="icons"><i style="width:14px;height:10px"></i><i style="width:10px;height:10px;border-radius:5px"></i><i style="width:20px;height:10px"></i></span></div>
            <div class="map">
              <svg width="360" height="330" viewBox="0 0 360 330">
                <g stroke="#1C2440" stroke-width="11" fill="none" stroke-linecap="round"><path d="M-20 110 C 80 96 170 130 380 112" /><path d="M58 -20 C 70 100 44 220 70 350" /><path d="M262 -20 C 240 120 270 220 248 350" /><path d="M-20 252 C 120 232 200 270 380 240" /></g>
                <g stroke="#161D35" stroke-width="5" fill="none"><path d="M-20 178 L 380 190" /><path d="M156 -20 L 166 350" /><path d="M318 -20 L 300 350" /></g>
                <path id="route" d="M30 312 C 64 236 96 196 156 176 S 250 132 318 56" fill="none" stroke="#6F7899" stroke-opacity="0.55" stroke-width="2.5" stroke-dasharray="1 7" stroke-linecap="round" />
              </svg>
              <!-- Stars stamped along the walked route, one per minute -->
              <div id="m1" class="ms" style="left:44px; top:282px"><svg fill="var(--brand)"><use href="#ajrakh" /></svg></div>
              <div id="m2" class="ms" style="left:70px; top:232px"><svg fill="var(--brand)"><use href="#ajrakh" /></svg></div>
              <div id="m3" class="ms" style="left:104px; top:197px"><svg fill="var(--brand)"><use href="#ajrakh" /></svg></div>
              <div id="m4" class="ms" style="left:146px; top:179px"><svg fill="var(--brand)"><use href="#ajrakh" /></svg></div>
              <div id="m5" class="ms" style="left:196px; top:162px"><svg fill="var(--brand)"><use href="#ajrakh" /></svg></div>
              <div id="m6" class="ms" style="left:244px; top:136px"><svg fill="var(--brand)"><use href="#ajrakh" /></svg></div>
              <div id="halo" style="position:absolute; left:30px; top:312px; width:44px; height:44px; margin:-22px 0 0 -22px; border-radius:50%; background:rgba(143,162,232,0.2)"></div>
              <div id="me" style="position:absolute; left:30px; top:312px; width:16px; height:16px; margin:-8px 0 0 -8px; border-radius:50%; background:var(--brand); box-shadow:0 0 0 3px #fff"></div>
            </div>
            <div class="sheet">
              <div class="handle"></div>
              <div class="t-title" data-t="place"></div>
              <div class="t-watch"><i class="dot" style="background:var(--ok)"></i><span data-t="watching"></span></div>
              <div class="t-min"><b id="tmin">0</b><span data-t="watched"></span></div>
              <div class="t-dest"><i class="dot" style="background:var(--ok)"></i><span data-t="dest"></span></div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script>
      const T = {
        en: { place: "4th Main Road", watching: "Watching your Uber auto", watched: "watched", dest: "Going to Work · watching for detours" },
        hi: { place: "4th Main Road", watching: "आपके Uber ऑटो पर नज़र है", watched: "नज़र रखी", dest: "ऑफ़िस जा रही हैं · रास्ता बदलने पर नज़र है" },
      };
      const vars = (window.__hyperframes && window.__hyperframes.getVariables && window.__hyperframes.getVariables()) || {};
      const lang = vars.lang === "hi" ? "hi" : "en";
      document.documentElement.lang = lang;
      if (lang === "hi") document.querySelectorAll(".t-title").forEach((e) => (e.style.letterSpacing = "0"));
      document.querySelectorAll("[data-t]").forEach((e) => (e.textContent = T[lang][e.dataset.t]));

      const at = (s, px, py) => ({ scale: s, x: 360 - s * px, y: 360 - s * py });
      // Wide on the map first, then settle on the whole trip card.
      gsap.set("#cam", at(1.5, 300, 250));
      gsap.set([".ms"], { opacity: 0, scale: 1.6 });
      const mins = { v: 0 };
      const showMin = () => (document.getElementById("tmin").textContent = String(Math.round(mins.v)));
      showMin();

      const tl = gsap.timeline({ paused: true });
      // The auto moves along her route; a star is stamped behind it each "minute".
      const pts = [[44, 282], [70, 232], [104, 197], [146, 179], [196, 162], [244, 136], [292, 92]];
      pts.forEach(([x, y], i) => {
        const t = 0.2 + i * 0.75;
        tl.to(["#me", "#halo"], { left: x, top: y, duration: 0.75, ease: "none" }, t);
        if (i < 6) {
          // Stamp: lands at 1.6x and 35% ink, settles to 1x over 200 ms (DESIGN.md "stamp").
          tl.fromTo(`#m${i + 1}`, { opacity: 0.35, scale: 1.6 }, { opacity: 1, scale: 1, duration: 0.26, ease: "expo.out", immediateRender: false }, t + 0.75);
          tl.to(mins, { v: i + 1, duration: 0.01, onUpdate: showMin }, t + 0.75);
        }
      });
      // Pull back to the whole trip card while the thread keeps growing.
      tl.to("#cam", { ...at(1.22, 352, 330), duration: 1.4, ease: "power2.inOut" }, 3.2);

      // 8.3 – 9  Reset for the loop: the thread lifts, the camera returns.
      tl.to(".ms", { opacity: 0, duration: 0.3, ease: "power2.in" }, 8.3);
      tl.to(["#me", "#halo"], { left: 30, top: 312, duration: 0.6, ease: "power2.inOut" }, 8.3);
      tl.to("#cam", { ...at(1.5, 300, 250), duration: 0.65, ease: "power2.inOut" }, 8.3);
      tl.to(mins, { v: 0, duration: 0.01, onUpdate: showMin }, 8.5);

      window.__timelines = window.__timelines || {};
      window.__timelines["onb_welcome"] = tl;
    </script>
  </body>
</html>
