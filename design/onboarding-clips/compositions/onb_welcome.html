<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=720, height=720" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        margin: 0;
        width: 720px;
        height: 720px;
        overflow: hidden;
        background: #0D1222;
      }
      #root {
        width: 720px;
        height: 720px;
        position: relative;
        background: #0D1222;
        overflow: hidden;
      }
      /* Map background grid */
      .map-road {
        stroke: #1B2340;
        stroke-width: 14;
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .map-road-minor {
        stroke: #141A2E;
        stroke-width: 8;
        fill: none;
        stroke-linecap: round;
      }
      .route-trail {
        stroke: #2E3F8644;
        stroke-width: 4;
        fill: none;
        stroke-dasharray: 6 8;
      }
      .star-stamp {
        position: absolute;
        left: 0;
        top: 0;
        width: 36px;
        height: 36px;
        margin-left: -18px;
        margin-top: -18px;
        transform-origin: center center;
        opacity: 0;
      }
      .star-stamp svg {
        width: 100%;
        height: 100%;
      }
      .auto-vehicle {
        position: absolute;
        left: 0;
        top: 0;
        width: 52px;
        height: 64px;
        margin-left: -26px;
        margin-top: -32px;
        transform-origin: center center;
        z-index: 10;
        filter: drop-shadow(0 8px 16px rgba(11,15,28,0.5));
      }
      .pulse-ring {
        position: absolute;
        left: 0;
        top: 0;
        width: 96px;
        height: 96px;
        margin-left: -48px;
        margin-top: -48px;
        border-radius: 50%;
        border: 2px solid #8FA2E8;
        opacity: 0;
        pointer-events: none;
        z-index: 5;
      }
      .final-badge {
        position: absolute;
        left: 360px;
        top: 360px;
        width: 80px;
        height: 80px;
        margin-left: -40px;
        margin-top: -40px;
        background: #25336B;
        border-radius: 24px;
        display: flex;
        align-items: center;
        justify-content: center;
        border: 1px solid #FFFFFF22;
        box-shadow: 0 12px 32px rgba(13,18,34,0.6);
        opacity: 0;
        transform: scale(0.5);
        z-index: 20;
      }
      .final-badge svg {
        width: 44px;
        height: 44px;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      class="clip"
      data-composition-id="onb_welcome"
      data-start="0"
      data-duration="6"
      data-width="720"
      data-height="720"
    >
      <!-- Background map grid -->
      <svg width="720" height="720" style="position:absolute; inset:0;">
        <path class="map-road-minor" d="M 0 180 L 720 180 M 0 540 L 720 540 M 180 0 L 180 720 M 540 0 L 540 720" />
        <path class="map-road" d="M 60 80 Q 220 120 280 280 T 480 460 T 640 620" />
        <path class="map-road" d="M 660 100 L 480 260 L 260 480 L 80 640" />
        <!-- Main route line -->
        <path id="routePath" class="route-trail" d="M 120 160 C 220 200, 240 380, 360 400 C 460 420, 520 320, 600 480" />
      </svg>

      <!-- Stamped stars along the trip -->
      <div id="star1" class="star-stamp">
        <svg viewBox="0 0 48 48"><rect x="10" y="10" width="28" height="28" rx="2" fill="#8FA2E8"/><rect x="10" y="10" width="28" height="28" rx="2" fill="#8FA2E8" transform="rotate(45 24 24)"/></svg>
      </div>
      <div id="star2" class="star-stamp">
        <svg viewBox="0 0 48 48"><rect x="10" y="10" width="28" height="28" rx="2" fill="#8FA2E8"/><rect x="10" y="10" width="28" height="28" rx="2" fill="#8FA2E8" transform="rotate(45 24 24)"/></svg>
      </div>
      <div id="star3" class="star-stamp">
        <svg viewBox="0 0 48 48"><rect x="10" y="10" width="28" height="28" rx="2" fill="#8FA2E8"/><rect x="10" y="10" width="28" height="28" rx="2" fill="#8FA2E8" transform="rotate(45 24 24)"/></svg>
      </div>
      <div id="star4" class="star-stamp">
        <svg viewBox="0 0 48 48"><rect x="10" y="10" width="28" height="28" rx="2" fill="#8FA2E8"/><rect x="10" y="10" width="28" height="28" rx="2" fill="#8FA2E8" transform="rotate(45 24 24)"/></svg>
      </div>
      <div id="star5" class="star-stamp">
        <svg viewBox="0 0 48 48"><rect x="10" y="10" width="28" height="28" rx="2" fill="#8FA2E8"/><rect x="10" y="10" width="28" height="28" rx="2" fill="#8FA2E8" transform="rotate(45 24 24)"/></svg>
      </div>
      <div id="star6" class="star-stamp">
        <svg viewBox="0 0 48 48"><rect x="10" y="10" width="28" height="28" rx="2" fill="#8FA2E8"/><rect x="10" y="10" width="28" height="28" rx="2" fill="#8FA2E8" transform="rotate(45 24 24)"/></svg>
      </div>

      <!-- Pulse ripple at destination -->
      <div id="destPulse" class="pulse-ring"></div>

      <!-- Auto Rickshaw vehicle SVG -->
      <div id="auto" class="auto-vehicle">
        <svg viewBox="0 0 52 64" fill="none">
          <!-- Headlight beam -->
          <polygon points="26,10 6,0 46,0" fill="#E7B94A" opacity="0.3" />
          <!-- Wheels -->
          <rect x="4" y="38" width="6" height="18" rx="3" fill="#11162A" />
          <rect x="42" y="38" width="6" height="18" rx="3" fill="#11162A" />
          <rect x="23" y="2" width="6" height="14" rx="3" fill="#11162A" />
          <!-- Chassis / Green body -->
          <rect x="8" y="18" width="36" height="42" rx="10" fill="#1E7A4C" />
          <!-- Yellow cabin roof -->
          <rect x="10" y="14" width="32" height="34" rx="8" fill="#E7B94A" />
          <!-- Windshield -->
          <rect x="14" y="16" width="24" height="10" rx="3" fill="#0D1222" />
          <!-- Rear cover -->
          <rect x="12" y="36" width="28" height="18" rx="4" fill="#1B2340" />
        </svg>
      </div>

      <!-- Settling Ajrakh Star Badge -->
      <div id="finalBadge" class="final-badge">
        <svg viewBox="0 0 48 48">
          <rect x="10" y="10" width="28" height="28" rx="2" fill="#FFFFFF"/>
          <rect x="10" y="10" width="28" height="28" rx="2" fill="#FFFFFF" transform="rotate(45 24 24)"/>
        </svg>
      </div>
    </div>

    <script>
      // Immediate initial setup outside paused timeline
      gsap.set("#auto", { x: 120, y: 160, rotation: 35, opacity: 1 });
      gsap.set("#star1", { x: 120, y: 160, opacity: 0, scale: 0 });
      gsap.set("#star2", { x: 210, y: 230, opacity: 0, scale: 0 });
      gsap.set("#star3", { x: 280, y: 350, opacity: 0, scale: 0 });
      gsap.set("#star4", { x: 380, y: 405, opacity: 0, scale: 0 });
      gsap.set("#star5", { x: 480, y: 360, opacity: 0, scale: 0 });
      gsap.set("#star6", { x: 600, y: 480, opacity: 0, scale: 0 });
      gsap.set("#destPulse", { x: 600, y: 480, opacity: 0, scale: 0.5 });
      gsap.set("#finalBadge", { opacity: 0, scale: 0.5 });

      const tl = gsap.timeline({ paused: true });

      // Star 1 stamps immediately
      tl.fromTo("#star1", { scale: 1.8, opacity: 0.3 }, { scale: 1, opacity: 1, duration: 0.3, ease: "back.out(2)" }, 0.1);

      // Move auto P1 -> P2
      tl.to("#auto", {
        x: 210, y: 230, rotation: 55, duration: 0.65, ease: "power1.inOut"
      }, 0.2);
      tl.fromTo("#star2", { scale: 1.8, opacity: 0.3 }, { scale: 1, opacity: 1, duration: 0.3, ease: "back.out(2)" }, 0.85);

      // Move auto P2 -> P3
      tl.to("#auto", {
        x: 280, y: 350, rotation: 40, duration: 0.7, ease: "power1.inOut"
      }, 0.9);
      tl.fromTo("#star3", { scale: 1.8, opacity: 0.3 }, { scale: 1, opacity: 1, duration: 0.3, ease: "back.out(2)" }, 1.6);

      // Move auto P3 -> P4
      tl.to("#auto", {
        x: 380, y: 405, rotation: -10, duration: 0.7, ease: "power1.inOut"
      }, 1.65);
      tl.fromTo("#star4", { scale: 1.8, opacity: 0.3 }, { scale: 1, opacity: 1, duration: 0.3, ease: "back.out(2)" }, 2.35);

      // Move auto P4 -> P5
      tl.to("#auto", {
        x: 480, y: 360, rotation: 30, duration: 0.7, ease: "power1.inOut"
      }, 2.4);
      tl.fromTo("#star5", { scale: 1.8, opacity: 0.3 }, { scale: 1, opacity: 1, duration: 0.3, ease: "back.out(2)" }, 3.1);

      // Move auto P5 -> P6 (arrival)
      tl.to("#auto", {
        x: 600, y: 480, rotation: 45, duration: 0.75, ease: "power2.out"
      }, 3.15);
      tl.fromTo("#star6", { scale: 1.8, opacity: 0.3 }, { scale: 1, opacity: 1, duration: 0.35, ease: "back.out(2)" }, 3.9);

      // Destination pulse
      tl.to("#destPulse", {
        scale: 1.6, opacity: 0.8, duration: 0.5, ease: "power2.out"
      }, 3.9);
      tl.to("#destPulse", {
        scale: 2.4, opacity: 0, duration: 0.6, ease: "power2.in"
      }, 4.4);

      // Final settling mark appears in center
      tl.to("#finalBadge", {
        scale: 1.1, opacity: 1, duration: 0.5, ease: "back.out(1.8)"
      }, 4.2);
      tl.to("#finalBadge", {
        scale: 1.0, duration: 0.3, ease: "power1.out"
      }, 4.7);

      // Smooth loop fade out at 5.7s to 6.0s
      tl.to(["#root"], {
        opacity: 0.95, duration: 0.3, ease: "power1.in"
      }, 5.7);

      window.__timelines = window.__timelines || {};
      window.__timelines["onb_welcome"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
